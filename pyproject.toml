[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highly-modular-flask-chess-app"
version = "0.1.0"
description = "A modular Flask chess app scaffold using Flask-SQLAlchemy and python-chess"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
